name: Build

# Builds LLARP-Control.exe with the .NET Framework C# compiler that ships with Windows.
# Release: push a tag like v1.0.0.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: LLARP-Control
          path: dist/LLARP-Control.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/LLARP-Control.exe \
            --title "LLARP Control for Windows ${GITHUB_REF_NAME#v}" \
            --notes "Download LLARP-Control.exe and run it. It installs itself, WSL 2 if needed, a Debian distro and llarpd, then starts your node."
